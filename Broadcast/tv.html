<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран на ТВ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Браузер телевизора может быть старым Chromium: без gap и inset.
     Картинка позиционируется абсолютно: процентная высота внутри flex-элемента
     в старых движках не работает, и экран телефона обрезался снизу. */
  #screens {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    padding: 1vh 1vw;
  }
  .screen { position: relative; flex: 1 1 0%; min-width: 0; }
  .screen + .screen { margin-left: 1vw; }
  .screen img, .screen video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .label {
    position: absolute;
    top: 2vh;
    left: 50%;
    transform: translateX(-50%);
    padding: .4em .9em;
    border-radius: 999px;
    background: rgba(0, 0, 0, .6);
    font-size: 2.2vh;
    white-space: nowrap;
    transition: opacity .4s;
  }
  #empty {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10vw;
    text-align: center;
  }
  #empty h1 { margin: 0 0 3vh; font-size: 5.5vh; font-weight: 600; }
  #empty p { margin: .5em 0; font-size: 2.8vh; line-height: 1.4; color: #9a9a9a; }
  #bar { position: fixed; right: 2vw; bottom: 3vh; transition: opacity .4s; }
  #fullscreen {
    padding: .7em 1.4em;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    color: #fff;
    font: inherit;
    font-size: 2.4vh;
    cursor: pointer;
  }
  #fullscreen:focus { outline: 3px solid #4da3ff; outline-offset: 3px; }
  body.idle { cursor: none; }
  body.idle .label, body.idle #bar { opacity: 0; }
</style>
</head>
<body>
<div id="screens"></div>
<div id="empty">
  <h1>Ждём телефон</h1>
  <p>На iPhone открой «Экран на ТВ» и нажми «Начать вещание».</p>
  <p>Телефон и телевизор должны быть в одной сети Wi-Fi.</p>
</div>
<div id="bar"><button id="fullscreen" type="button">Во весь экран</button></div>
<script src="jmuxer.min.js"></script>
<script>
// Только ES5: встроенный браузер старых телевизоров LG не знает let, стрелочные функции и async.
(function () {
  'use strict';

  var POLL_MS = 2000;
  var MAX_FAILS = 3;
  var HIDE_UI_MS = 4000;
  var VIDEO_START_MS = 8000;
  var MAX_LAG_S = 0.5;

  // H.264 через Media Source Extensions. Если браузер не умеет, показываем MJPEG.
  var canPlayVideo = !!(window.JMuxer && window.MediaSource &&
    MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"'));

  // Телефоны в порядке обнаружения: первый показывается слева.
  var phones = [];
  var screens = document.getElementById('screens');
  var empty = document.getElementById('empty');

  function find(host) {
    for (var i = 0; i < phones.length; i++) {
      if (phones[i].host === host) return phones[i];
    }
    return null;
  }

  function add(host) {
    if (host && !find(host)) {
      phones.push({ host: host, fails: 0, tile: null, media: null, mode: '', fps: 0, noVideo: false });
    }
  }

  // Каждый телефон отвечает, жив ли он, и сообщает адреса соседей, найденных через Bonjour.
  function poll(phone) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'http://' + phone.host + '/status?t=' + Date.now());
    xhr.timeout = 1500;
    xhr.onload = function () {
      var status;
      try {
        status = JSON.parse(xhr.responseText);
      } catch (e) {
        fail(phone);
        return;
      }
      phone.fails = 0;
      phone.videoPort = status.video;
      show(phone);
      (status.peers || []).forEach(add);
    };
    xhr.onerror = xhr.ontimeout = function () { fail(phone); };
    xhr.send();
  }

  function fail(phone) {
    phone.fails++;
    if (phone.fails >= MAX_FAILS) hide(phone);
  }

  function show(phone) {
    if (phone.tile) return;
    var tile = document.createElement('div');
    var label = document.createElement('div');
    tile.className = 'screen';
    label.className = 'label';
    tile.appendChild(label);
    phone.tile = tile;
    phone.label = label;

    if (canPlayVideo && phone.videoPort && !phone.noVideo) {
      startVideo(phone);
    } else {
      startJpeg(phone);
    }

    var next = null;
    for (var i = phones.indexOf(phone) + 1; i < phones.length; i++) {
      if (phones[i].tile) {
        next = phones[i].tile;
        break;
      }
    }
    screens.insertBefore(tile, next);
    relabel();
  }

  function hide(phone) {
    if (!phone.tile) return;
    stopMedia(phone);
    screens.removeChild(phone.tile);
    phone.tile = null;
    relabel();
  }

  function setMedia(phone, element, mode) {
    phone.media = element;
    phone.mode = mode;
    phone.fps = 0;
    phone.tile.insertBefore(element, phone.label);
  }

  function stopMedia(phone) {
    var media = phone.media;
    phone.media = null;
    clearTimeout(phone.startTimer);
    if (phone.ws) {
      var ws = phone.ws;
      phone.ws = null;
      ws.close();
    }
    if (phone.muxer) {
      try { phone.muxer.destroy(); } catch (e) {}
      phone.muxer = null;
    }
    if (media) {
      media.removeAttribute('src'); // обрывает поток, телефон перестаёт сжимать кадры
      if (media.load) media.load();
      media.parentNode.removeChild(media);
    }
  }

  // --- MJPEG ---

  function startJpeg(phone) {
    var img = document.createElement('img');
    setMedia(phone, img, 'MJPEG');
    // Поток оборвался, а телефон ещё отвечает на /status: переподключаемся.
    img.onerror = function () {
      setTimeout(function () {
        if (phone.media === img) connectJpeg(phone);
      }, 1000);
    };
    connectJpeg(phone);
  }

  function connectJpeg(phone) {
    phone.media.src = 'http://' + phone.host + '/stream?t=' + Date.now();
  }

  // --- H.264 ---

  function startVideo(phone) {
    var video = document.createElement('video');
    video.muted = true;
    video.autoplay = true;
    video.setAttribute('playsinline', '');
    setMedia(phone, video, 'H.264');
    phone.sps = null;
    phone.frames = 0;
    phone.decoded = decodedFrames(video);
    openSocket(phone, video);

    // Видео так и не пошло: значит, браузер не справляется с H.264. Переходим на MJPEG.
    phone.startTimer = setTimeout(function () {
      if (phone.media === video && video.readyState < 2) {
        phone.noVideo = true;
        stopMedia(phone);
        startJpeg(phone);
        relabel();
      }
    }, VIDEO_START_MS);
  }

  function openSocket(phone, video) {
    var ws = new WebSocket('ws://' + phone.host.split(':')[0] + ':' + phone.videoPort + '/');
    ws.binaryType = 'arraybuffer';
    phone.ws = ws;
    ws.onmessage = function (event) {
      if (phone.ws === ws) feed(phone, event.data);
    };
    ws.onclose = function () {
      if (phone.ws !== ws) return;
      phone.ws = null;
      setTimeout(function () {
        if (phone.media === video) openSocket(phone, video);
      }, 1000);
    };
  }

  // Сообщение: 1 байт флагов (бит 0 — ключевой кадр), 4 байта времени в мс, затем кадр в Annex B.
  function feed(phone, buffer) {
    var bytes = new Uint8Array(buffer);
    var isKey = (bytes[0] & 1) === 1;
    var time = new DataView(buffer).getUint32(1);
    var frame = bytes.subarray(5);

    if (isKey) {
      // Телефон повернули — разрешение и SPS сменились. Плеер нужно пересоздать.
      var sps = findSps(frame);
      if (sps !== null && sps !== phone.sps) {
        resetMuxer(phone);
        phone.sps = sps;
      }
    }
    if (!phone.muxer) return; // ждём ключевой кадр

    var duration = phone.lastTime === null ? 33 : Math.max(1, Math.min(100, time - phone.lastTime));
    phone.lastTime = time;
    phone.frames++;
    phone.muxer.feed({ video: frame, duration: duration });
  }

  function resetMuxer(phone) {
    if (phone.muxer) {
      try { phone.muxer.destroy(); } catch (e) {}
    }
    phone.lastTime = null;
    phone.muxer = new JMuxer({
      node: phone.media,
      mode: 'video',
      flushingTime: 0,
      clearBuffer: true,
      fps: 30,
      debug: false,
      onError: function () {
        // Плеер сломался — пересоздадим его на следующем ключевом кадре.
        phone.sps = null;
      }
    });
  }

  // SPS (NAL типа 7) телефон ставит первым в ключевом кадре. Возвращает его байты строкой.
  function findSps(frame) {
    if (frame.length < 5 || (frame[4] & 0x1f) !== 7) return null;
    var end = 5;
    while (end + 3 < frame.length &&
      !(frame[end] === 0 && frame[end + 1] === 0 && (frame[end + 2] === 1 || (frame[end + 2] === 0 && frame[end + 3] === 1)))) {
      end++;
    }
    return Array.prototype.join.call(frame.subarray(4, end), ',');
  }

  function decodedFrames(video) {
    if (video.getVideoPlaybackQuality) return video.getVideoPlaybackQuality().totalVideoFrames;
    return video.webkitDecodedFrameCount || 0;
  }

  // Плеер браузера копит буфер, и задержка растёт. Держим видео у живого края.
  function keepLive() {
    phones.forEach(function (phone) {
      var video = phone.media;
      if (!video || phone.mode !== 'H.264' || !video.buffered.length) return;
      var end = video.buffered.end(video.buffered.length - 1);
      if (end - video.currentTime > MAX_LAG_S) video.currentTime = end - 0.05;
      if (video.paused) {
        var playing = video.play();
        if (playing && playing.catch) playing.catch(function () {});
      }
    });
  }

  function measureFps() {
    phones.forEach(function (phone) {
      if (!phone.media || phone.mode !== 'H.264') return;
      var decoded = decodedFrames(phone.media);
      phone.fps = Math.round((decoded - phone.decoded) / 2);
      phone.decoded = decoded;
    });
    relabel();
  }

  // --- Общее ---

  function relabel() {
    var count = 0;
    phones.forEach(function (phone) {
      if (!phone.tile) return;
      var text = 'Телефон ' + (++count) + ' · ' + phone.mode;
      if (phone.mode === 'H.264' && phone.fps > 0) text += ' · ' + phone.fps + ' к/с';
      phone.label.textContent = text;
    });
    empty.style.display = count ? 'none' : '';
  }

  function tick() {
    phones.forEach(poll);
  }

  // Подпись и кнопка прячутся, если пульт не трогали несколько секунд.
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, HIDE_UI_MS);
  }
  ['mousemove', 'keydown', 'click', 'touchstart'].forEach(function (type) {
    document.addEventListener(type, wake);
  });

  var fullscreen = document.getElementById('fullscreen');
  fullscreen.onclick = function () {
    var root = document.documentElement;
    var request = root.requestFullscreen || root.webkitRequestFullscreen;
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (exit) exit.call(document);
    } else if (request) {
      request.call(root);
    }
  };

  // Телефон, который отдал эту страницу, плюс адреса из #хеша на случай,
  // если роутер не пропускает Bonjour: http://адрес-1:8080/#адрес-2:8080
  add(location.host);
  location.hash.slice(1).split(',').forEach(add);
  tick();
  setInterval(tick, POLL_MS);
  setInterval(keepLive, 500);
  setInterval(measureFps, 2000);
  wake();
  fullscreen.focus();
})();
</script>
</body>
</html>
