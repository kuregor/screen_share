<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран на ТВ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Браузер телевизора может быть старым Chromium: без gap и inset.
     Картинка позиционируется абсолютно: процентная высота внутри flex-элемента
     в старых движках не работает, и экран телефона обрезался снизу. */
  #screens {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    padding: 1vh 1vw;
  }
  .screen { position: relative; flex: 1 1 0%; min-width: 0; }
  .screen + .screen { margin-left: 1vw; }
  .screen img, .screen video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .label {
    position: absolute;
    top: 2vh;
    left: 50%;
    transform: translateX(-50%);
    padding: .4em .9em;
    border-radius: 999px;
    background: rgba(0, 0, 0, .6);
    font-size: 2.2vh;
    white-space: nowrap;
    transition: opacity .4s;
  }
  #empty {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10vw;
    text-align: center;
  }
  #empty h1 { margin: 0 0 3vh; font-size: 5.5vh; font-weight: 600; }
  #empty p { margin: .5em 0; font-size: 2.8vh; line-height: 1.4; color: #9a9a9a; }
  #bar { position: fixed; right: 2vw; bottom: 3vh; transition: opacity .4s; }
  #fullscreen {
    padding: .7em 1.4em;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    color: #fff;
    font: inherit;
    font-size: 2.4vh;
    cursor: pointer;
  }
  #fullscreen:focus { outline: 3px solid #4da3ff; outline-offset: 3px; }
  body.idle { cursor: none; }
  body.idle .label, body.idle #bar { opacity: 0; }
  /* Внутри Media Station X страница — видеоплагин: пульт управляет MSX, кнопка не нужна. */
  body.embedded #bar { display: none; }
</style>
</head>
<body>
<div id="screens"></div>
<div id="empty">
  <h1>Ждём телефон</h1>
  <p>На iPhone открой «Экран на ТВ» и нажми «Начать вещание».</p>
  <p>Телефон и телевизор должны быть в одной сети Wi-Fi.</p>
</div>
<div id="bar"><button id="fullscreen" type="button">Во весь экран</button></div>
<script src="jmuxer.min.js"></script>
<script>
// Только ES5: встроенный браузер старых телевизоров LG не знает let, стрелочные функции и async.
(function () {
  'use strict';

  var POLL_MS = 2000;
  var MAX_FAILS = 3;
  var HIDE_UI_MS = 4000;
  var FIRST_HIDE_UI_MS = 15000;
  var VIDEO_START_MS = 8000;
  // Задержку убираем плавно, чуть ускоряя видео. Перемотка заметна как рывок, поэтому только при большом отставании.
  var CATCH_UP_LAG_S = 0.25;
  var JUMP_LAG_S = 1.5;

  // H.264 играет через Media Source Extensions и jmuxer. Самому jmuxer нужны функции
  // ES2015 (Array.from, Object.assign, Reflect, Symbol): на webOS 3.x их нет, и он падает при создании.
  var hasEs2015 = typeof Array.from === 'function' && typeof Object.assign === 'function' &&
    typeof Reflect === 'object' && typeof Symbol === 'function' &&
    typeof Array.prototype.includes === 'function';
  var canPlayVideo = !!(window.JMuxer && window.MediaSource && hasEs2015) &&
    MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"');
  var RETRY_VIDEO_MS = 30000;

  // Журнал диагностики уходит на телефон, его можно прочитать с компьютера: http://адрес-телефона:8080/log
  function report(phone, text) {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'http://' + phone.host + '/log?m=' + encodeURIComponent(text));
      xhr.send();
    } catch (e) {}
  }

  function environment() {
    var codecs = ['avc1.42E01E', 'avc1.4D401F', 'avc1.4D4028', 'avc1.4D402A', 'avc1.640028'];
    var support = codecs.map(function (codec) {
      var ok = window.MediaSource && MediaSource.isTypeSupported('video/mp4; codecs="' + codec + '"');
      return codec + '=' + (ok ? 'да' : 'нет');
    });
    return 'старт: ' + navigator.userAgent + ' | экран ' + screen.width + 'x' + screen.height +
      ' | окно ' + window.innerWidth + 'x' + window.innerHeight + ' | в iframe: ' + embedded +
      ' | MediaSource: ' + !!window.MediaSource + ' | ES2015: ' + hasEs2015 + ' | WebSocket: ' + !!window.WebSocket +
      ' | ' + support.join(' ');
  }

  // Телефоны в порядке обнаружения: первый показывается слева.
  var phones = [];
  var screens = document.getElementById('screens');
  var empty = document.getElementById('empty');

  function find(host) {
    for (var i = 0; i < phones.length; i++) {
      if (phones[i].host === host) return phones[i];
    }
    return null;
  }

  function add(host) {
    if (host && !find(host)) {
      phones.push({ host: host, fails: 0, tile: null, media: null, mode: '', fps: 0, noVideo: false, session: 0 });
    }
  }

  // Каждый телефон отвечает, жив ли он, и сообщает адреса соседей, найденных через Bonjour.
  function poll(phone) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'http://' + phone.host + '/status?t=' + Date.now());
    xhr.timeout = 1500;
    xhr.onload = function () {
      var status;
      try {
        status = JSON.parse(xhr.responseText);
      } catch (e) {
        fail(phone);
        return;
      }
      phone.fails = 0;
      phone.videoPort = status.video;
      // Токен для сокета: без него телефон не отдаёт видео.
      phone.token = status.token;
      show(phone);
      (status.peers || []).forEach(add);
    };
    xhr.onerror = xhr.ontimeout = function () { fail(phone); };
    xhr.send();
  }

  function fail(phone) {
    phone.fails++;
    if (phone.fails >= MAX_FAILS) hide(phone);
  }

  function show(phone) {
    if (phone.tile) return;
    var tile = document.createElement('div');
    var label = document.createElement('div');
    tile.className = 'screen';
    label.className = 'label';
    tile.appendChild(label);
    phone.tile = tile;
    phone.label = label;

    if (canPlayVideo && phone.videoPort && !phone.noVideo) {
      startVideo(phone);
    } else {
      if (!canPlayVideo) phone.reason = hasEs2015 ? 'браузер без MSE' : 'старый браузер';
      startJpeg(phone);
    }

    var next = null;
    for (var i = phones.indexOf(phone) + 1; i < phones.length; i++) {
      if (phones[i].tile) {
        next = phones[i].tile;
        break;
      }
    }
    screens.insertBefore(tile, next);
    relabel();
  }

  function hide(phone) {
    if (!phone.tile) return;
    stopMedia(phone);
    screens.removeChild(phone.tile);
    phone.tile = null;
    // Телефон ушёл. Когда вернётся, снова пробуем H.264, а не остаёмся на MJPEG навсегда.
    phone.noVideo = false;
    phone.retried = false;
    phone.reason = '';
    relabel();
  }

  function setMedia(phone, element, mode) {
    phone.media = element;
    phone.mode = mode;
    phone.fps = 0;
    phone.tile.insertBefore(element, phone.label);
  }

  function stopMedia(phone) {
    var media = phone.media;
    phone.media = null;
    phone.session++;
    clearTimeout(phone.startTimer);
    if (phone.ws) {
      var ws = phone.ws;
      phone.ws = null;
      ws.close();
    }
    destroyPlayer(phone.muxer);
    phone.muxer = null;
    if (media) {
      media.removeAttribute('src'); // обрывает поток, телефон перестаёт сжимать кадры
      if (media.load) media.load();
      media.parentNode.removeChild(media);
    }
  }

  // --- MJPEG ---

  function startJpeg(phone) {
    var img = document.createElement('img');
    setMedia(phone, img, 'MJPEG');
    // Поток оборвался, а телефон ещё отвечает на /status: переподключаемся.
    img.onerror = function () {
      setTimeout(function () {
        if (phone.media === img) connectJpeg(phone);
      }, 1000);
    };
    connectJpeg(phone);
  }

  function connectJpeg(phone) {
    phone.media.src = 'http://' + phone.host + '/stream?t=' + Date.now();
  }

  // --- H.264 ---

  function createVideo(phone) {
    var video = document.createElement('video');
    video.muted = true;
    video.autoplay = true;
    video.setAttribute('playsinline', '');
    video.addEventListener('loadedmetadata', function () {
      report(phone, 'видео ' + video.videoWidth + 'x' + video.videoHeight);
    });
    video.addEventListener('error', function () {
      var error = video.error;
      report(phone, 'ошибка video: код ' + (error && error.code) + ' ' + (error && error.message || ''));
    });
    return video;
  }

  function startVideo(phone) {
    setMedia(phone, createVideo(phone), 'H.264');
    // Номер сеанса: таймеры и сокеты от прошлых сеансов проверяют его и ничего не трогают.
    var session = phone.session;
    phone.turns = 0;
    phone.sps = null;
    phone.frames = 0;
    phone.framesBefore = 0;
    phone.received = 0;
    phone.decoded = 0;
    openSocket(phone, session);

    // Видео так и не пошло: значит, браузер не справляется с H.264. Переходим на MJPEG.
    // Пока страница скрыта, браузер не загружает видео, поэтому скрытое время не считаем.
    phone.startTimer = setTimeout(function check() {
      var video = phone.media;
      if (phone.session !== session) return;
      if (document.hidden || document.webkitHidden) {
        phone.startTimer = setTimeout(check, VIDEO_START_MS);
        return;
      }
      if (video.readyState < 2) {
        report(phone, 'кадров ' + phone.frames + ', readyState ' + video.readyState + ', видео ' +
          video.videoWidth + 'x' + video.videoHeight + ', ошибка ' + (video.error && video.error.code));
        fallBackToJpeg(phone, phone.frames ? 'не декодируется' : 'нет кадров');
      }
    }, VIDEO_START_MS);
  }

  // Переход на MJPEG. Один раз через 30 секунд пробуем H.264 снова: сбой мог быть случайным.
  function fallBackToJpeg(phone, reason) {
    if (!phone.tile || phone.mode !== 'H.264') return;
    report(phone, 'переход на MJPEG: ' + reason);
    phone.reason = reason;
    phone.noVideo = true;
    stopMedia(phone);
    startJpeg(phone);
    relabel();
    if (phone.retried) return;
    phone.retried = true;
    var tile = phone.tile;
    setTimeout(function () {
      if (phone.tile !== tile || phone.mode !== 'MJPEG') return;
      report(phone, 'снова пробуем H.264');
      phone.noVideo = false;
      phone.reason = '';
      stopMedia(phone);
      startVideo(phone);
      relabel();
    }, RETRY_VIDEO_MS);
  }

  // Сокет с подпротоколом-токеном: без токена телефон соединение не примет.
  function connectSocket(phone, port) {
    var url = 'ws://' + phone.host.split(':')[0] + ':' + port + '/';
    var ws = phone.token ? new WebSocket(url, ['t-' + phone.token]) : new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    return ws;
  }

  function openSocket(phone, session) {
    var ws = connectSocket(phone, phone.videoPort);
    phone.ws = ws;
    ws.onopen = function () { report(phone, 'сокет открыт'); };
    ws.onmessage = function (event) {
      if (phone.ws === ws) feed(phone, event.data);
    };
    ws.onclose = function (event) {
      if (phone.ws !== ws) return;
      report(phone, 'сокет закрыт: код ' + event.code);
      phone.ws = null;
      setTimeout(function () {
        if (phone.session === session) openSocket(phone, session);
      }, 1000);
    };
  }

  // Телефон повернули, и разрешение сменилось. Старый элемент video может сохранить прежние
  // пропорции и показать новую картинку мелко, с полосами со всех сторон. Поэтому ставим новый элемент.
  function replaceVideo(phone) {
    destroyPlayer(phone.muxer);
    phone.muxer = null;
    var old = phone.media;
    var video = createVideo(phone);
    phone.tile.replaceChild(video, old);
    old.removeAttribute('src');
    old.load();
    phone.media = video;
    phone.decoded = 0;
    layoutVideo(phone);
  }

  // Поворачивает видео внутри плитки. При повороте на четверть оборота элемент получает
  // размеры плитки наоборот (ширина = высота плитки), ставится по центру и поворачивается.
  function layoutVideo(phone) {
    var video = phone.media;
    if (!video || phone.mode !== 'H.264') return;
    var style = video.style;
    var turns = phone.turns || 0;
    if (turns % 2 === 0) {
      style.top = style.left = '0';
      style.width = style.height = '100%';
    } else {
      var w = phone.tile.clientWidth;
      var h = phone.tile.clientHeight;
      style.width = h + 'px';
      style.height = w + 'px';
      style.left = (w - h) / 2 + 'px';
      style.top = (h - w) / 2 + 'px';
    }
    style.webkitTransform = style.transform = turns ? 'rotate(' + turns * 90 + 'deg)' : '';
  }

  // Сообщение: 1 байт флагов (бит 0 — ключевой кадр, биты 1–2 — поворот в четвертях оборота
  // по часовой), 4 байта времени в мс, затем кадр в Annex B.
  function feed(phone, buffer) {
    var bytes = new Uint8Array(buffer);
    var isKey = (bytes[0] & 1) === 1;
    var turns = (bytes[0] >> 1) & 3;
    var time = new DataView(buffer).getUint32(1);
    var frame = bytes.subarray(5);

    // Телефон шлёт кадр всегда горизонтальным (так его понимает декодер телевизора),
    // а повернуть его как надо — наша задача. Поток не меняет разрешение при повороте телефона.
    if (turns !== phone.turns) {
      phone.turns = turns;
      layoutVideo(phone);
    }

    if (isKey) {
      // Первый ключевой кадр запускает плеер. Новый SPS значит, что телефон повернули
      // или плеер сломался: тогда пересоздаём и плеер, и элемент video.
      var sps = findSps(frame);
      if (sps !== null && sps !== phone.sps) {
        report(phone, 'новый SPS, кодек avc1.' + hex(frame[5]) + hex(frame[6]) + hex(frame[7]) +
          ', поворот ' + turns);
        if (phone.sps !== null) replaceVideo(phone);
        resetMuxer(phone);
        phone.sps = sps;
      }
    }
    if (!phone.muxer) return; // ждём ключевой кадр

    var duration = phone.lastTime === null ? 17 : Math.max(1, Math.min(100, time - phone.lastTime));
    phone.lastTime = time;
    phone.frames++;
    feedPlayer(phone.muxer, { video: frame, duration: duration });
  }

  function resetMuxer(phone) {
    destroyPlayer(phone.muxer);
    phone.lastTime = null;
    phone.muxer = createPlayer(phone, phone.media, 'video', {
      onError: function (error) {
        report(phone, 'ошибка jmuxer: ' + describe(error));
        // Плеер сломался. Метка не совпадёт ни с одним SPS, и следующий ключевой кадр всё пересоздаст.
        phone.sps = 'broken';
      },
      onUnsupportedCodec: function (codec) {
        report(phone, 'кодек не поддерживается: ' + describe(codec));
      }
    });
    // Плеер не создался даже после проверки возможностей браузера: сразу MJPEG, не ждём 8 секунд.
    if (!phone.muxer) setTimeout(function () { fallBackToJpeg(phone, 'ошибка плеера'); }, 0);
  }

  // Обёртка над jmuxer. Если данные пришли раньше, чем браузер открыл MediaSource
  // (событие sourceopen), jmuxer теряет начальный сегмент, и плеер так и не запускается.
  // На медленном телевизоре так легко получить «не декодируется». Поэтому до onReady
  // данные копятся в очереди.
  // Возвращает null, если jmuxer не создался: ошибка уже записана в журнал.
  function createPlayer(phone, node, mode, callbacks) {
    var player = { ready: false, queue: [] };
    try {
      player.muxer = new JMuxer({
        node: node,
        mode: mode,
        // Данные отдаются плееру пачками раз в 60 мс, а не по кадру: 60 добавлений в секунду
        // перегружают слабый процессор телевизора. При flushingTime больше нуля jmuxer
        // ещё и не перематывает сам, отставание держит keepLive.
        flushingTime: 60,
        clearBuffer: true,
        fps: 60,
        debug: false,
        onReady: function () {
          player.ready = true;
          player.queue.forEach(function (item) { feedPlayer(player, item); });
          player.queue = [];
        },
        onError: callbacks.onError,
        onUnsupportedCodec: callbacks.onUnsupportedCodec
      });
    } catch (error) {
      report(phone, 'jmuxer не создан (' + mode + '): ' + describe(error));
      return null;
    }
    player.onError = callbacks.onError;
    return player;
  }

  function feedPlayer(player, item) {
    if (!player.ready) {
      if (player.queue.length < 300) player.queue.push(item);
      return;
    }
    try {
      player.muxer.feed(item);
    } catch (error) {
      player.onError(error);
    }
  }

  function destroyPlayer(player) {
    if (!player) return;
    try { player.muxer.destroy(); } catch (e) {}
  }

  function hex(byte) {
    return (byte < 16 ? '0' : '') + byte.toString(16).toUpperCase();
  }

  function describe(value) {
    if (value && value.message) return value.message;
    try {
      return JSON.stringify(value);
    } catch (e) {
      return String(value);
    }
  }

  // SPS (NAL типа 7) телефон ставит первым в ключевом кадре. Возвращает его байты строкой.
  function findSps(frame) {
    if (frame.length < 5 || (frame[4] & 0x1f) !== 7) return null;
    var end = 5;
    while (end + 3 < frame.length &&
      !(frame[end] === 0 && frame[end + 1] === 0 && (frame[end + 2] === 1 || (frame[end + 2] === 0 && frame[end + 3] === 1)))) {
      end++;
    }
    return Array.prototype.join.call(frame.subarray(4, end), ',');
  }

  function decodedFrames(video) {
    if (video.getVideoPlaybackQuality) return video.getVideoPlaybackQuality().totalVideoFrames;
    return video.webkitDecodedFrameCount || 0;
  }

  // Плеер браузера копит буфер, и задержка растёт. Держим видео у живого края.
  function keepLive() {
    phones.forEach(function (phone) {
      var video = phone.media;
      if (!video || phone.mode !== 'H.264') return;
      // Размер плитки меняется, когда подключается или уходит второй телефон.
      layoutVideo(phone);
      if (catchUp(video) && video.paused) {
        var playing = video.play();
        if (playing && playing.catch) playing.catch(function () {});
      }
    });
  }

  // Возвращает true, если в элементе есть что играть.
  function catchUp(element) {
    if (!element.buffered.length) return false;
    var end = element.buffered.end(element.buffered.length - 1);
    var lag = end - element.currentTime;
    if (lag > JUMP_LAG_S) element.currentTime = end - 0.1;
    var rate = lag > CATCH_UP_LAG_S ? 1.1 : 1;
    if (element.playbackRate !== rate) element.playbackRate = rate;
    return true;
  }

  // Сколько кадров в секунду пришло по сети и сколько показал плеер.
  // Мало пришло — не успевает телефон или Wi-Fi. Пришло много, а показано мало — не успевает телевизор.
  function measureFps() {
    phones.forEach(function (phone) {
      if (!phone.media || phone.mode !== 'H.264') return;
      var decoded = decodedFrames(phone.media);
      phone.fps = Math.round((decoded - phone.decoded) / 2);
      phone.received = Math.round((phone.frames - phone.framesBefore) / 2);
      phone.decoded = decoded;
      phone.framesBefore = phone.frames;
      var video = phone.media;
      var lag = video.buffered.length ? video.buffered.end(video.buffered.length - 1) - video.currentTime : -1;
      // Телефон по этим цифрам подстраивает частоту кадров: если телевизор не успевает показывать, шлёт меньше.
      if (phone.ws && phone.ws.readyState === 1 && phone.received > 0) {
        phone.ws.send(JSON.stringify({ fps: phone.fps, rx: phone.received, lag: Math.round(lag * 100) / 100 }));
      }
      // Раз в 10 секунд — сводка в журнал.
      phone.reports = (phone.reports || 0) + 1;
      if (phone.reports % 5 === 0) {
        report(phone, 'приём ' + phone.received + ' показ ' + phone.fps + ' к/с, отставание ' +
          lag.toFixed(2) + ' с, скорость ' + video.playbackRate + ', readyState ' + video.readyState +
          ', видео ' + video.videoWidth + 'x' + video.videoHeight + ', поворот ' + phone.turns);
      }
    });
    relabel();
  }

  // --- Общее ---

  function relabel() {
    var count = 0;
    phones.forEach(function (phone) {
      if (!phone.tile) return;
      var text = 'Телефон ' + (++count) + ' · ' + phone.mode;
      if (phone.mode === 'H.264' && phone.received > 0) {
        text += ' · приём ' + phone.received + ' · показ ' + phone.fps + ' к/с';
      }
      if (phone.mode === 'MJPEG' && phone.reason) text += ' (H.264: ' + phone.reason + ')';
      phone.label.textContent = text;
    });
    empty.style.display = count ? 'none' : '';
  }

  function tick() {
    phones.forEach(poll);
  }

  // Подпись и кнопка прячутся, если пульт не трогали несколько секунд.
  // В MSX страница не получает нажатий пульта, поэтому при запуске подпись видна подольше.
  var idleTimer = null;
  function wake(delay) {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, delay || HIDE_UI_MS);
  }
  ['mousemove', 'keydown', 'click', 'touchstart'].forEach(function (type) {
    document.addEventListener(type, function () { wake(); });
  });

  var fullscreen = document.getElementById('fullscreen');
  fullscreen.onclick = function () {
    var root = document.documentElement;
    var request = root.requestFullscreen || root.webkitRequestFullscreen;
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (exit) exit.call(document);
    } else if (request) {
      request.call(root);
    }
  };

  var embedded;
  try {
    embedded = window.self !== window.top;
  } catch (e) {
    embedded = true;
  }
  if (embedded) document.body.className += ' embedded';
  if (location.host) report({ host: location.host }, environment());

  // Телефон, который отдал эту страницу, плюс адреса из #хеша на случай,
  // если роутер не пропускает Bonjour: http://адрес-1:8080/#адрес-2:8080
  add(location.host);
  location.hash.slice(1).split(',').forEach(add);
  tick();
  setInterval(tick, POLL_MS);
  setInterval(keepLive, 500);
  setInterval(measureFps, 2000);
  wake(FIRST_HIDE_UI_MS);
  fullscreen.focus();
})();
</script>
</body>
</html>
